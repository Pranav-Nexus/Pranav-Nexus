<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background-color: #f0f0f0;\n        }\n        .clock {\n            text-align: center;\n            padding: 20px;\n            background: white;\n            border-radius: 10px;\n            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n        }\n    </style>\n</head>\n<body>\n    <div class="clock">\n        <h1>Digital Clock</h1>\n        <div id="time"></div>\n        <div>\n            <h3>Current Time in Various Time Zones:</h3>\n            <div id="world-times"></div>\n        </div>\n    </div>\n    <script>\n        function updateTime() {\n            const now = new Date();\n            const utc = now.toUTCString().slice(0, -13);\n            document.getElementById('time').innerText = utc;\n            const timeZones = {\n                "New York": -4,\n                "London": 1,\n                "Tokyo": 9,\n                "Sydney": 11\n            };\n            let timesHtml = '';\n            for (const [city, offset] of Object.entries(timeZones)) {\n                const localTime = new Date(now.getTime() + offset * 60 * 60 * 1000);\n                timesHtml += `<div>${city}: ${localTime.toLocaleTimeString()}</div>`;\n            }\n            document.getElementById('world-times').innerHTML = timesHtml;\n        }\n        setInterval(updateTime, 1000);\n        updateTime();\n    </script>\n</body>\n</html>
